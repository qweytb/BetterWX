name: Build

on:
  push:
    tags: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy
      - run: cargo build --release
      - uses: actions/upload-artifact@v7
        with:
          name: betterwx-windows-x64
          path: target/release/betterwx.exe
      - uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          draft: true
          files: target/release/betterwx.exe
